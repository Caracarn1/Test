<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar System Scale Model</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow-y: auto; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #solar-section { position: relative; width: 100%; height: 100vh; overflow: hidden; }
        #photo-section {
            background: #000;
            text-align: center;
            padding: 40px 20px 60px;
            border-top: 1px solid #222;
        }
        #photo-section img {
            max-width: 700px;
            width: 90%;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(58,111,216,0.3);
        }
        #photo-section p {
            color: #aaa;
            font-size: 13px;
            margin-top: 14px;
        }

        #info {
            position: absolute;
            top: 15px; left: 15px;
            color: #fff;
            pointer-events: none;
        }
        #info h1 { font-size: 18px; margin-bottom: 4px; }
        #info p  { font-size: 12px; color: #aaa; }

        #legend {
            position: absolute;
            top: 15px; right: 15px;
            color: #fff;
            font-size: 12px;
            line-height: 2;
            pointer-events: none;
        }
        #legend span {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* ── Controls bar ── */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0,0,0,0.65);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px 20px;
            color: #fff;
            font-size: 13px;
            user-select: none;
        }
        #date-display {
            font-size: 15px;
            font-weight: bold;
            min-width: 130px;
            text-align: center;
            color: #ffd700;
        }
        #controls button {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        #controls button:hover  { background: #2a2a4e; }
        #controls button.active { background: #3a6fd8; border-color: #5a8ff8; }
        #speed-label { color: #aaa; font-size: 12px; }
        #speed-slider { width: 100px; accent-color: #3a6fd8; }

        /* ── Planet labels ── */
        #label-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .planet-label {
            position: absolute;
            color: #fff;
            font-size: 11px;
            background: rgba(0,0,0,0.55);
            padding: 2px 6px;
            border-radius: 3px;
            transform: translate(-50%, -160%);
            white-space: nowrap;
        }

        /* ── Planet popup ── */
        #popup {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0d1b2a, #1b2a3b);
            border: 1px solid #3a6fd8;
            border-radius: 14px;
            padding: 22px 26px;
            color: #fff;
            width: 280px;
            box-shadow: 0 0 30px rgba(58,111,216,0.4);
            z-index: 100;
        }
        #popup h2 {
            font-size: 20px;
            margin-bottom: 14px;
            color: #ffd700;
            border-bottom: 1px solid #2a3a4e;
            padding-bottom: 8px;
        }
        #popup table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #popup td { padding: 5px 4px; }
        #popup td:first-child { color: #aaa; width: 55%; }
        #popup td:last-child  { color: #fff; font-weight: bold; }
        #popup-close {
            position: absolute;
            top: 10px; right: 14px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        #popup-close:hover { color: #fff; }
        #popup-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
        #info p.click-hint { margin-top: 4px; }
    </style>
</head>
<body>

<div id="solar-section">
    <div id="info">
        <h1>Solar System — Scale Model</h1>
        <p>Scroll to zoom &nbsp;•&nbsp; Drag to rotate &nbsp;•&nbsp; Right-drag to pan</p>
        <p class="click-hint" style="color:#ffd700;font-size:11px;margin-top:4px;">Click any planet for facts</p>
    </div>

    <div id="legend"></div>
    <div id="label-container"></div>

    <div id="popup">
        <button id="popup-close" onclick="closePopup()">&#x2715;</button>
        <h2 id="popup-title"></h2>
        <table id="popup-table"></table>
    </div>

    <div id="controls">
        <button id="btn-random" class="active" onclick="setRandomStart()">Random Start</button>
        <button id="btn-today"  onclick="setTodayStart()">Today's Positions</button>
        <button id="btn-pause"  onclick="togglePause()">&#9646;&#9646; Pause</button>
        <div id="date-display">—</div>
        <span id="speed-label">Speed:</span>
        <input id="speed-slider" type="range" min="1" max="200" value="30">
        <span id="speed-val">30 days/s</span>
    </div>
</div>

<div id="photo-section">
    <img src="{{ url_for('static', filename='photo.jpg') }}" alt="My photo">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script>

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 50000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.getElementById('solar-section').appendChild(renderer.domElement);

const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.05;
orbitControls.minDistance   = 5;
orbitControls.maxDistance   = 2000;

// ── Stars ─────────────────────────────────────────────────────────────────────
(function() {
    const pos = [];
    for (let i = 0; i < 12000; i++)
        pos.push((Math.random()-.5)*8000, (Math.random()-.5)*8000, (Math.random()-.5)*8000);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.7 })));
})();

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.PointLight(0xffffff, 2.5, 2000));
scene.add(new THREE.AmbientLight(0x222222));

// ── Orbital elements at J2000 ─────────────────────────────────────────────────
const ELEMENTS = {
    Mercury: { L0: 252.25084, rate: 4.09233445 },
    Venus:   { L0: 181.97973, rate: 1.60213034 },
    Earth:   { L0: 100.46457, rate: 0.98560028 },
    Mars:    { L0: 355.45332, rate: 0.52402068 },
    Jupiter: { L0:  34.40438, rate: 0.08308529 },
    Saturn:  { L0:  49.94432, rate: 0.03346316 },
    Uranus:  { L0: 313.23218, rate: 0.01172834 },
    Neptune: { L0: 304.88003, rate: 0.00598103 },
};

function dateToJ2000(date) {
    return (date - new Date('2000-01-01T12:00:00Z')) / 86400000;
}
function j2000ToDate(days) {
    return new Date(new Date('2000-01-01T12:00:00Z').getTime() + days * 86400000);
}
function planetAngle(name, j2000Days) {
    const el = ELEMENTS[name];
    return THREE.MathUtils.degToRad(((el.L0 + el.rate * j2000Days) % 360 + 360) % 360);
}

// ── Planet facts ──────────────────────────────────────────────────────────────
const FACTS = {
    Mercury: { 'Diameter':'4,879 km', 'Distance from Sun':'57.9M km', 'Moons':'0', 'Day length':'59 Earth days', 'Year length':'88 Earth days', 'Temp (day)':'430°C', 'Temp (night)':'−180°C' },
    Venus:   { 'Diameter':'12,104 km', 'Distance from Sun':'108.2M km', 'Moons':'0', 'Day length':'243 Earth days', 'Year length':'225 Earth days', 'Temp (avg)':'465°C', 'Atmosphere':'96% CO₂' },
    Earth:   { 'Diameter':'12,742 km', 'Distance from Sun':'149.6M km', 'Moons':'1', 'Day length':'24 hours', 'Year length':'365.25 days', 'Temp (avg)':'15°C', 'Atmosphere':'78% N₂, 21% O₂' },
    Mars:    { 'Diameter':'6,779 km', 'Distance from Sun':'227.9M km', 'Moons':'2', 'Day length':'24.6 hours', 'Year length':'687 Earth days', 'Temp (avg)':'−65°C', 'Atmosphere':'95% CO₂' },
    Jupiter: { 'Diameter':'139,820 km', 'Distance from Sun':'778.5M km', 'Moons':'95', 'Day length':'9.9 hours', 'Year length':'11.86 Earth years', 'Mass':'318 × Earth', 'Type':'Gas Giant' },
    Saturn:  { 'Diameter':'116,460 km', 'Distance from Sun':'1.43B km', 'Moons':'146', 'Day length':'10.7 hours', 'Year length':'29.46 Earth years', 'Ring width':'282,000 km', 'Type':'Gas Giant' },
    Uranus:  { 'Diameter':'50,724 km', 'Distance from Sun':'2.87B km', 'Moons':'28', 'Day length':'17.2 hours', 'Year length':'84 Earth years', 'Temp (avg)':'−195°C', 'Type':'Ice Giant' },
    Neptune: { 'Diameter':'49,244 km', 'Distance from Sun':'4.50B km', 'Moons':'16', 'Day length':'16.1 hours', 'Year length':'164.8 Earth years', 'Wind speed':'2,100 km/h', 'Type':'Ice Giant' },
};

// ── Planet definitions ────────────────────────────────────────────────────────
const AU = 18;
const PLANETS = [
    { name:'Mercury', radius:0.20, dist:0.387*AU, color:0x9e9e9e, tilt:0.03  },
    { name:'Venus',   radius:0.47, dist:0.723*AU, color:0xe8cda0, tilt:177.4 },
    { name:'Earth',   radius:0.50, dist:1.000*AU, color:0x2b6cb0, tilt:23.4  },
    { name:'Mars',    radius:0.27, dist:1.524*AU, color:0xc1440e, tilt:25.2  },
    { name:'Jupiter', radius:1.80, dist:5.203*AU, color:0xc88b3a, tilt:3.1   },
    { name:'Saturn',  radius:1.52, dist:9.537*AU, color:0xe4d191, tilt:26.7, rings:true },
    { name:'Uranus',  radius:0.90, dist:19.19*AU, color:0x7de8e8, tilt:97.8  },
    { name:'Neptune', radius:0.85, dist:30.07*AU, color:0x3f54ba, tilt:28.3  },
];

// ── Sun ───────────────────────────────────────────────────────────────────────
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(4, 64, 64),
    new THREE.MeshBasicMaterial({ color:0xFDB813 })
);
scene.add(sun);
scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(5.5, 32, 32),
    new THREE.MeshBasicMaterial({ color:0xff8800, transparent:true, opacity:0.12 })
));

// ── Build planets ─────────────────────────────────────────────────────────────
const legendEl       = document.getElementById('legend');
const labelContainer = document.getElementById('label-container');
const planetObjects  = [];
const clickableMeshes = [];  // for raycasting
let earthMesh = null;

PLANETS.forEach(p => {
    // Orbit ring
    const orbit = new THREE.Mesh(
        new THREE.RingGeometry(p.dist - 0.08, p.dist + 0.08, 180),
        new THREE.MeshBasicMaterial({ color:0x333333, side:THREE.DoubleSide })
    );
    orbit.rotation.x = Math.PI / 2;
    scene.add(orbit);

    const pivot = new THREE.Object3D();
    scene.add(pivot);

    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.radius, 48, 48),
        new THREE.MeshLambertMaterial({ color: p.color })
    );
    mesh.position.x = p.dist;
    mesh.rotation.z = THREE.MathUtils.degToRad(p.tilt);
    mesh.userData   = { planetName: p.name };
    pivot.add(mesh);
    clickableMeshes.push(mesh);

    if (p.name === 'Earth') earthMesh = mesh;

    if (p.rings) {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(p.radius*1.5, p.radius*2.4, 80),
            new THREE.MeshBasicMaterial({ color:0xd4b483, side:THREE.DoubleSide, transparent:true, opacity:0.75 })
        );
        ring.rotation.x = Math.PI / 2.4;
        mesh.add(ring);
    }

    const label = document.createElement('div');
    label.className   = 'planet-label';
    label.textContent = p.name;
    labelContainer.appendChild(label);

    const hex = '#' + p.color.toString(16).padStart(6,'0');
    legendEl.innerHTML += `<div><span style="background:${hex}"></span>${p.name}</div>`;

    planetObjects.push({ pivot, mesh, label, name: p.name });
});

// ── Moon ──────────────────────────────────────────────────────────────────────
const moonPivot = new THREE.Object3D();
earthMesh.add(moonPivot);

const moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 32, 32),
    new THREE.MeshLambertMaterial({ color: 0xaaaaaa })
);
moonMesh.position.x  = 1.4;   // ~60 Earth radii, compressed for visibility
moonMesh.userData    = { planetName: 'Moon' };
moonPivot.add(moonMesh);
clickableMeshes.push(moonMesh);

FACTS['Moon'] = {
    'Diameter':'3,474 km',
    'Distance from Earth':'384,400 km',
    'Orbital period':'27.3 days',
    'Day length':'27.3 Earth days',
    'Temp (day)':'127°C',
    'Temp (night)':'−173°C',
    'Surface':'Craters, maria, highlands',
};

const moonLabel = document.createElement('div');
moonLabel.className   = 'planet-label';
moonLabel.textContent = 'Moon';
labelContainer.appendChild(moonLabel);

const MOON_RATE = 360 / 27.32;   // degrees per day

// ── Asteroid Belt ─────────────────────────────────────────────────────────────
(function buildAsteroidBelt() {
    const innerR = 2.2 * AU;
    const outerR = 3.2 * AU;
    const count  = 3000;
    const positions = [];

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r     = innerR + Math.random() * (outerR - innerR);
        const y     = (Math.random() - 0.5) * 3;   // slight vertical scatter
        positions.push(Math.cos(angle) * r, y, Math.sin(angle) * r);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color:0x888888, size:0.25, transparent:true, opacity:0.7 });
    scene.add(new THREE.Points(geo, mat));

    // Belt label
    const beltLabel = document.createElement('div');
    beltLabel.className   = 'planet-label';
    beltLabel.textContent = 'Asteroid Belt';
    beltLabel.style.color = '#aaa';
    beltLabel.style.fontSize = '10px';
    labelContainer.appendChild(beltLabel);

    // Project belt label at midpoint of belt on x-axis
    const beltLabelMesh = new THREE.Object3D();
    beltLabelMesh.position.set((innerR + outerR) / 2, 0, 0);
    scene.add(beltLabelMesh);
    window._beltLabelMesh = beltLabelMesh;
    window._beltLabel     = beltLabel;
})();

// ── Simulation time ───────────────────────────────────────────────────────────
let simTime = 0;

function setRandomStart() {
    simTime = Math.random() * 365 * 50;
    document.getElementById('btn-random').classList.add('active');
    document.getElementById('btn-today').classList.remove('active');
}
function setTodayStart() {
    simTime = dateToJ2000(new Date());
    document.getElementById('btn-today').classList.add('active');
    document.getElementById('btn-random').classList.remove('active');
}
setRandomStart();

// ── Speed control ─────────────────────────────────────────────────────────────
const speedSlider = document.getElementById('speed-slider');
const speedVal    = document.getElementById('speed-val');
speedSlider.addEventListener('input', () => {
    speedVal.textContent = speedSlider.value + ' days/s';
});

// ── Date display ──────────────────────────────────────────────────────────────
const dateDisplay = document.getElementById('date-display');
const DATE_OPTS   = { year:'numeric', month:'short', day:'numeric' };

// ── Popup ─────────────────────────────────────────────────────────────────────
function showPopup(name) {
    const facts = FACTS[name];
    if (!facts) return;
    document.getElementById('popup-title').textContent = name;
    const rows = Object.entries(facts)
        .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
        .join('');
    document.getElementById('popup-table').innerHTML = rows;
    document.getElementById('popup').style.display = 'block';
}
function closePopup() {
    document.getElementById('popup').style.display = 'none';
}

// ── Raycaster for clicks ──────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let mouseDownPos = { x: 0, y: 0 };

renderer.domElement.addEventListener('mousedown', e => {
    mouseDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mouseup', e => {
    const dx = e.clientX - mouseDownPos.x;
    const dy = e.clientY - mouseDownPos.y;
    if (Math.sqrt(dx*dx + dy*dy) > 5) return;   // was a drag, not a click

    mouse.x = (e.clientX / innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObjects(clickableMeshes);
    if (hits.length > 0) {
        showPopup(hits[0].object.userData.planetName);
    }
});

// ── Label projection ──────────────────────────────────────────────────────────
const _v = new THREE.Vector3();
function projectLabel(obj3d, label) {
    _v.setFromMatrixPosition(obj3d.matrixWorld);
    _v.project(camera);
    const x = ( _v.x * 0.5 + 0.5) * innerWidth;
    const y = (-_v.y * 0.5 + 0.5) * innerHeight;
    label.style.left    = x + 'px';
    label.style.top     = y + 'px';
    label.style.display = (_v.z < 1) ? 'block' : 'none';
}

// ── Camera ────────────────────────────────────────────────────────────────────
camera.position.set(0, 120, 260);
orbitControls.update();

// ── Animation ─────────────────────────────────────────────────────────────────
let lastTime = performance.now();
let paused   = false;

function togglePause() {
    paused = !paused;
    document.getElementById('btn-pause').innerHTML = paused ? '&#9654; Play' : '&#9646;&#9646; Pause';
    if (!paused) { lastTime = performance.now(); }
}

function animate() {
    requestAnimationFrame(animate);

    const now      = performance.now();
    const deltaSec = (now - lastTime) / 1000;
    lastTime = now;

    if (paused) { orbitControls.update(); renderer.render(scene, camera); return; }
    simTime += parseFloat(speedSlider.value) * deltaSec;

    // Update planets
    planetObjects.forEach(p => {
        p.pivot.rotation.y = planetAngle(p.name, simTime);
        p.mesh.rotation.y += 0.01;
        projectLabel(p.mesh, p.label);
    });

    // Update Moon
    const moonAngleDeg = ((ELEMENTS.Earth.L0 + MOON_RATE * simTime) % 360 + 360) % 360;
    moonPivot.rotation.y = THREE.MathUtils.degToRad(moonAngleDeg);
    projectLabel(moonMesh, moonLabel);

    // Belt label
    if (window._beltLabelMesh && window._beltLabel)
        projectLabel(window._beltLabelMesh, window._beltLabel);

    // Date
    dateDisplay.textContent = j2000ToDate(simTime).toLocaleDateString('en-GB', DATE_OPTS);

    sun.rotation.y += 0.001;
    orbitControls.update();
    renderer.render(scene, camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
